---
# https://taskfile.dev

version: "3"

includes:
  mcp:
    taskfile: ./mcp/Taskfile.yml
    dir: ./mcp

tasks:
  install:
    desc: Install dependencies for all subprojects.
    cmds:
      - task: mcp:install

  format:
    desc: Format the entire repository.
    cmds:
      - stylua --config-path .stylua.toml . -v
      - task: mcp:format

  lint:
    desc: Lint the entire repository (Lua + Python).
    cmds:
      - stylua --config-path .stylua.toml --check .
      - selene .
      - task: mcp:lint

  test:
    desc: Run tests across all subprojects.
    cmds:
      - task: mcp:test
