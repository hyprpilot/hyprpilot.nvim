---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap toolchain via mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Lint Lua
        run: |
          stylua --config-path .stylua.toml --check .
          selene .

  lint-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap toolchain via mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install workspace deps
        run: task install

      - name: Lint
        run: task lint

  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap toolchain via mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install workspace deps
        run: task install

      - name: Test
        run: task test
