---
# Conventional Commits → version-bump table that release-please applies
# (Angular preset, parser-baked):
#
#   `feat: ...`         → minor    (0.1.9 → 0.2.0)
#   `fix: ...`          → patch    (0.1.9 → 0.1.10)
#   `perf: ...`         → patch    (changelog: "Performance" section)
#   `refactor: ...`     → patch    (changelog: "Refactor" section)
#   `docs: ...`         → patch    (changelog: "Documentation" section)
#   `chore/test/ci: ..` → no bump  (hidden in changelog)
#
# To force a major bump from any type, use the `!` suffix or
# `BREAKING CHANGE:` footer:
#
#   `feat!: drop X`     → major    (0.1.9 → 1.0.0)
#   `perf!: replace Y`  → major
#   `fix!: rewire Z`    → major
#   plain commit body containing `BREAKING CHANGE: <text>` → major
#
# Tag shape: ONE shared tag covers both packages — `vX.Y.Z`.
# `release-please-config.json` sets `include-component-in-tag: false`
# and uses the `linked-versions` plugin so `hyprpilot.nvim` and
# `hyprpilot-nvim-mcp` always share the same version. The release PR
# is also combined (`separate-pull-requests: false`) so a single PR
# bumps both packages at once.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to the v5.0.0 SHA for supply-chain safety; Renovate /
      # Dependabot can track this with the trailing `# v5.0.0` comment.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
