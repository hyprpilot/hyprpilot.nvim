---
# Conventional Commits → version-bump table that release-please applies
# (Angular preset, parser-baked):
#
#   `feat: ...`         → minor    (0.1.9 → 0.2.0)
#   `fix: ...`          → patch    (0.1.9 → 0.1.10)
#   `perf: ...`         → patch    (changelog: "Performance" section)
#   `refactor: ...`     → patch    (changelog: "Refactor" section)
#   `docs: ...`         → patch    (changelog: "Documentation" section)
#   `chore/test/ci: ..` → no bump  (hidden in changelog)
#
# To force a major bump from any type, use the `!` suffix or
# `BREAKING CHANGE:` footer:
#
#   `feat!: drop X`     → major    (0.1.9 → 1.0.0)
#   `perf!: replace Y`  → major
#   `fix!: rewire Z`    → major
#   plain commit body containing `BREAKING CHANGE: <text>` → major
#
# Tag shape: ONE tag, ONE version covers both surfaces — `vX.Y.Z`.
# release-please tracks a SINGLE package (the repo root) and uses
# `extra-files` to bump `pkg/pyproject.toml`'s version field at
# release time, so the Python package's version is mechanically
# locked to the Lua plugin's. The previous multi-package +
# linked-versions setup let the Python and Lua versions drift
# (linked-versions only normalizes bump TYPES across components,
# not absolute version numbers — see PR #64 for the diagnosis).
# Lua plugin "version" lives only as the git tag (lazy.nvim /
# packer install from tags directly); the Python package gets the
# matching version pushed to PyPI via `publish-pypi.yml`.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Surface release-please's `release_created` output so the
    # downstream PyPI publish job can gate on it. Chaining via
    # `needs:` here is the standard workaround for the GitHub
    # anti-loop rule that swallows workflows triggered by
    # `secrets.GITHUB_TOKEN` (the tag push from release-please runs
    # as `github-actions[bot]` and won't fire `push: tags` triggers).
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6

      # Pinned to the v5.0.0 SHA for supply-chain safety; Renovate /
      # Dependabot can track this with the trailing `# v5.0.0` comment.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish-pypi:
    name: Publish hyprpilot-nvim-mcp to PyPI
    needs: release-please
    # Single-package config means every release is also a Python
    # release (the extra-files updater keeps `pkg/pyproject.toml`'s
    # version locked to the tag). So `release_created` is the only
    # gate we need.
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      # Required for OIDC trusted publishing — `id-token: write` must
      # be granted explicitly here because reusable workflows don't
      # inherit `id-token` from the caller's top-level permissions.
      id-token: write
    uses: ./.github/workflows/publish-pypi.yml
